name: mobistack
description: MobiStack — shop inventory, sales, and repairs.
publish_to: none
version: 1.3.12+23
environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  provider: ^6.1.2
  go_router: ^18.0.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  share_plus: ^12.0.2
  mobile_scanner: ^7.4.2
  webview_flutter: ^4.10.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  prabhix_identity:
    path: ../../packages/prabhix_identity
  prabhix_api_core:
    path: ../../packages/prabhix_api_core
  prabhix_offline:
    path: ../../packages/prabhix_offline
  prabhix_client:
    path: ../../packages/prabhix_client
  prabhix_theme:
    path: ../../packages/prabhix_theme
  prabhix_ui:
    path: ../../packages/prabhix_ui
  razorpay_flutter: 1.4.7

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fitment_catalog.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../../branding/icons/mobistack.png"
  adaptive_icon_background: "#0E7490"
  adaptive_icon_foreground: "../../branding/icons/mobistack.png"
