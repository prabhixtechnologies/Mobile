name: mobistack
description: MobiStack — shop inventory, sales, and repairs.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  mobile_scanner: ^6.0.2
  webview_flutter: ^4.10.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  prabhix_identity:
    path: ../../packages/prabhix_identity
  prabhix_api_core:
    path: ../../packages/prabhix_api_core
  prabhix_offline:
    path: ../../packages/prabhix_offline

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../../branding/icons/mobistack.png"
  adaptive_icon_background: "#0E7490"
  adaptive_icon_foreground: "../../branding/icons/mobistack.png"
