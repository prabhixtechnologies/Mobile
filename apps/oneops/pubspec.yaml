name: oneops
description: Prabhix OneOps — operator chat, visitors, dashboard.
publish_to: none
version: 1.1.3+7
environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  provider: ^6.1.2
  go_router: ^18.0.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  http: ^1.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  app_links: ^7.2.1
  uuid: ^4.5.1
  prabhix_identity:
    path: ../../packages/prabhix_identity
  prabhix_api_core:
    path: ../../packages/prabhix_api_core
  prabhix_offline:
    path: ../../packages/prabhix_offline
  prabhix_client:
    path: ../../packages/prabhix_client
  prabhix_theme:
    path: ../../packages/prabhix_theme
  prabhix_ui:
    path: ../../packages/prabhix_ui

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../../branding/icons/oneops.png"
  adaptive_icon_background: "#0E7490"
  adaptive_icon_foreground: "../../branding/icons/oneops.png"
