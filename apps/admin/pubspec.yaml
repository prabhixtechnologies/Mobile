name: admin
description: Prabhix Admin — platform overview (Identity OIDC).
publish_to: none
version: 1.1.3+7
environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  provider: ^6.1.2
  go_router: ^18.0.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  prabhix_identity:
    path: ../../packages/prabhix_identity
  prabhix_api_core:
    path: ../../packages/prabhix_api_core
  prabhix_offline:
    path: ../../packages/prabhix_offline
  prabhix_client:
    path: ../../packages/prabhix_client
  prabhix_theme:
    path: ../../packages/prabhix_theme
  prabhix_ui:
    path: ../../packages/prabhix_ui

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../../branding/icons/admin.png"
  adaptive_icon_background: "#0E7490"
  adaptive_icon_foreground: "../../branding/icons/admin.png"
