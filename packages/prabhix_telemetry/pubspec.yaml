name: prabhix_telemetry
description: Local-queue product analytics for Prabhix Flutter apps (24h success / 1h retry).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.0
  http: ^1.2.2
  path: ^1.9.0
  sqflite: ^2.4.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
