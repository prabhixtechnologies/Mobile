name: prabhix_client
description: Shared client recovery, upgrade gates, and deep-link validation for Prabhix Flutter apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  prabhix_api_core:
    path: ../prabhix_api_core
  prabhix_identity:
    path: ../prabhix_identity

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
