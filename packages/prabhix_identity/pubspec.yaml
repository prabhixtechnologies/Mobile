name: prabhix_identity
description: Prabhix Identity OIDC client (PKCE, secure storage, refresh mutex, logout).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_appauth: ^13.0.0
  # 11.x forces win32 ^6 and breaks file_picker/share_plus/package_info_plus peers.
  # 10.x still migrates EncryptedSharedPreferences; revisit 11 after those catch up.
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

