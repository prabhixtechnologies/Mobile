name: Flutter mobile CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, mailroom, oneops, mobistack]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get packages
        working-directory: packages/prabhix_identity
        run: flutter pub get
      - name: Pub get api_core
        working-directory: packages/prabhix_api_core
        run: flutter pub get
      - name: Pub get offline
        working-directory: packages/prabhix_offline
        run: flutter pub get
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  # Build store-facing APKs and publish to s3://prabhix-apk-downloads
  # → https://store.prabhixtechnologies.com/{product}/android.apk
  publish-apks:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: mailroom
            product: mailroom
            api_base: https://api.prabhixtechnologies.com/api/v1
          - app: oneops
            product: oneops
            api_base: https://api.prabhixtechnologies.com/api/v1
          - app: mobistack
            product: mobistack
            api_base: https://mobistack.prabhixtechnologies.com/api/v1
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: packages/prabhix_identity
      - run: flutter pub get
        working-directory: packages/prabhix_api_core
      - run: flutter pub get
        working-directory: packages/prabhix_offline
      - run: flutter pub get
      - name: Build release APK (unsigned fallback to debug)
        id: build
        env:
          IDENTITY_ISSUER: https://api.prabhixtechnologies.com
          API_BASE_URL: ${{ matrix.api_base }}
        run: |
          set -e
          DEFINES=(
            --dart-define=IDENTITY_ISSUER="$IDENTITY_ISSUER"
            --dart-define=API_BASE_URL="$API_BASE_URL"
          )
          if flutter build apk --release "${DEFINES[@]}"; then
            echo "apk=build/app/outputs/flutter-apk/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "Release build failed — falling back to debug APK"
            flutter build apk --debug "${DEFINES[@]}"
            echo "apk=build/app/outputs/flutter-apk/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.product }}-android
          path: apps/${{ matrix.app }}/${{ steps.build.outputs.apk }}
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APK_ROLE_ARN != '' && vars.AWS_APK_ROLE_ARN || 'arn:aws:iam::029096972251:role/prabhix-github-ecr-push' }}
          aws-region: ap-south-1
      - name: Upload APK to S3 store bucket
        working-directory: apps/${{ matrix.app }}
        env:
          PRODUCT: ${{ matrix.product }}
          APK_PATH: ${{ steps.build.outputs.apk }}
        run: |
          set -e
          aws s3 cp "$APK_PATH" "s3://prabhix-apk-downloads/${PRODUCT}/android.apk" \
            --content-type application/vnd.android.package-archive \
            --cache-control "no-cache, max-age=60"
          aws s3 cp "$APK_PATH" "s3://prabhix-apk-downloads/${PRODUCT}/latest.apk" \
            --content-type application/vnd.android.package-archive \
            --cache-control "no-cache, max-age=60"
          echo "Published → https://store.prabhixtechnologies.com/${PRODUCT}/android.apk"

  # Admin stays internal — artifact only, never the public store.
  admin-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: packages/prabhix_identity
      - run: flutter pub get
        working-directory: packages/prabhix_api_core
      - run: flutter pub get
        working-directory: packages/prabhix_offline
      - run: flutter pub get
      - name: Build Admin debug APK
        run: |
          flutter build apk --debug \
            --dart-define=IDENTITY_ISSUER=https://api.prabhixtechnologies.com \
            --dart-define=API_BASE_URL=https://api.prabhixtechnologies.com/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: prabhix-admin-debug
          path: apps/admin/build/app/outputs/flutter-apk/app-debug.apk
