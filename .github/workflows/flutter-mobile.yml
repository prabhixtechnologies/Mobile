name: Flutter mobile CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run live integration tests against a seeded stack
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, mailroom, oneops, mobistack]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get packages
        working-directory: packages/prabhix_identity
        run: flutter pub get
      - name: Pub get api_core
        working-directory: packages/prabhix_api_core
        run: flutter pub get
      - name: OpenAPI Dart clients
        if: matrix.app == 'admin'
        working-directory: packages/prabhix_api_core
        run: |
          set -euo pipefail
          echo "Dart Dio clients are generated from sibling OpenAPI snapshots:"
          echo "  powershell -File tool/generate.ps1"
          echo "This Mobile checkout does not include oneOps/MobiStack; generation runs in the workspace, not here."
          test -f lib/generated/README.md
          echo "See lib/generated/README.md"
      - name: Pub get offline
        working-directory: packages/prabhix_offline
        run: flutter pub get
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  # Opt-in: needs a reachable seeded stack (Identity + product APIs).
  # Default CI skips these tests inside `flutter test` unless INTEGRATION=1.
  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: admin
            api_base: http://127.0.0.1:8080/api/v1
          - app: mailroom
            api_base: http://127.0.0.1:8080/api/v1
          - app: oneops
            api_base: http://127.0.0.1:8080/api/v1
          - app: mobistack
            api_base: http://127.0.0.1:8085/api/v1
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: packages/prabhix_identity
      - run: flutter pub get
        working-directory: packages/prabhix_api_core
      - run: flutter pub get
        working-directory: packages/prabhix_offline
      - run: flutter pub get
      - name: Live integration tests
        env:
          INTEGRATION: "1"
          IDENTITY_ISSUER: ${{ vars.IDENTITY_ISSUER != '' && vars.IDENTITY_ISSUER || 'http://127.0.0.1:8081' }}
          API_BASE_URL: ${{ matrix.api_base }}
        run: flutter test test/integration_stack_test.dart

  # Build store-facing APKs and publish to s3://prabhix-apk-downloads
  # → https://store.prabhixtechnologies.com/{product}/android.apk
  publish-apks:
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    needs: analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: mailroom
            product: mailroom
            api_base: https://api.prabhixtechnologies.com/api/v1
          - app: oneops
            product: oneops
            api_base: https://api.prabhixtechnologies.com/api/v1
          - app: mobistack
            product: mobistack
            api_base: https://mobistack.prabhixtechnologies.com/api/v1
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: packages/prabhix_identity
      - run: flutter pub get
        working-directory: packages/prabhix_api_core
      - run: flutter pub get
        working-directory: packages/prabhix_offline
      - run: flutter pub get
      - name: Build release APK (unsigned fallback to debug)
        id: build
        env:
          IDENTITY_ISSUER: https://api.prabhixtechnologies.com
          API_BASE_URL: ${{ matrix.api_base }}
        run: |
          set -e
          DEFINES=(
            --dart-define=IDENTITY_ISSUER="$IDENTITY_ISSUER"
            --dart-define=API_BASE_URL="$API_BASE_URL"
          )
          if flutter build apk --release "${DEFINES[@]}"; then
            echo "apk=build/app/outputs/flutter-apk/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "Release build failed — falling back to debug APK"
            flutter build apk --debug "${DEFINES[@]}"
            echo "apk=build/app/outputs/flutter-apk/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.product }}-android
          path: apps/${{ matrix.app }}/${{ steps.build.outputs.apk }}
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APK_ROLE_ARN != '' && vars.AWS_APK_ROLE_ARN || 'arn:aws:iam::029096972251:role/prabhix-github-ecr-push' }}
          aws-region: ap-south-1
      - name: Upload APK to S3 store bucket
        working-directory: apps/${{ matrix.app }}
        env:
          PRODUCT: ${{ matrix.product }}
          APK_PATH: ${{ steps.build.outputs.apk }}
          VARIANT: ${{ steps.build.outputs.variant }}
        run: |
          set -e
          echo "Uploading $VARIANT APK for $PRODUCT from $APK_PATH"
          if ! aws s3 cp "$APK_PATH" "s3://prabhix-apk-downloads/${PRODUCT}/android.apk" \
            --content-type application/vnd.android.package-archive \
            --cache-control "no-cache, max-age=60"; then
            echo "::error::S3 PutObject denied. Attach PrabhixApkS3Push to the CI role (see CUTOVER.md). Role ARN is set (Option B) but the role still needs s3:PutObject on prabhix-apk-downloads."
            exit 1
          fi
          aws s3 cp "$APK_PATH" "s3://prabhix-apk-downloads/${PRODUCT}/latest.apk" \
            --content-type application/vnd.android.package-archive \
            --cache-control "no-cache, max-age=60"
          echo "Published → https://store.prabhixtechnologies.com/${PRODUCT}/android.apk ($VARIANT)"

  # Admin stays internal — artifact only, never the public store.
  admin-apk:
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    needs: analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: packages/prabhix_identity
      - run: flutter pub get
        working-directory: packages/prabhix_api_core
      - run: flutter pub get
        working-directory: packages/prabhix_offline
      - run: flutter pub get
      - name: Build Admin release APK
        id: build
        run: |
          set -e
          DEFINES=(
            --dart-define=IDENTITY_ISSUER=https://api.prabhixtechnologies.com
            --dart-define=API_BASE_URL=https://api.prabhixtechnologies.com/api/v1
          )
          if flutter build apk --release "${DEFINES[@]}"; then
            echo "apk=build/app/outputs/flutter-apk/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            flutter build apk --debug "${DEFINES[@]}"
            echo "apk=build/app/outputs/flutter-apk/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: prabhix-admin
          path: apps/admin/${{ steps.build.outputs.apk }}
